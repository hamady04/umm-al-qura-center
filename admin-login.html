<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل دخول الإدارة - مركز أم القرى</title>
  <meta name="description" content="تسجيل دخول إدارة مركز أم القرى">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div class="login-page">
    <div class="login-card">

      <!-- Logo -->
      <img src="/assets/logo.png" alt="شعار مركز أم القرى" class="login-logo" onerror="this.style.display='none'">

      <h1 class="login-title">تسجيل دخول الإدارة</h1>
      <p class="login-subtitle">مركز أم القرى لتحفيظ القرآن الكريم والسنة النبوية</p>

      <!-- Error Message -->
      <div id="login-error" class="alert alert-error" style="display:none; text-align:right; margin-bottom:var(--space-4);">
      </div>

      <!-- Login Form -->
      <form id="login-form" class="login-form" novalidate>

        <div class="form-group">
          <label class="form-label" for="email">البريد الإلكتروني</label>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="admin@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">كلمة المرور</label>
          <div style="position:relative;">
            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="••••••••"
              autocomplete="current-password"
              required
              style="padding-left: 3rem;"
            >
            <button
              type="button"
              id="toggle-password"
              onclick="togglePassword()"
              style="position:absolute; left:0.75rem; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:1.1rem; color:var(--gray-400);"
              title="إظهار/إخفاء كلمة المرور"
            >👁️</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-btn" style="margin-top:var(--space-4);">
          🔐 تسجيل الدخول
        </button>

      </form>

      <div class="divider" style="margin: var(--space-6) 0;"></div>

      <a href="/" style="color:var(--gray-500); font-size:var(--font-size-sm); display:block; text-align:center;">
        ← العودة إلى الصفحة الرئيسية
      </a>

    </div>
  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById('password')
      input.type = input.type === 'password' ? 'text' : 'password'
    }
  </script>
  <script type="module" src="/js/admin.js"></script>
</body>
</html>
