<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تعديل بيانات الطالب - مركز أم القرى</title>
  <meta name="description" content="تعديل بيانات الطالب في مركز أم القرى">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="admin-layout" data-page="edit">

  <!-- Admin Topbar -->
  <nav class="admin-topbar">
    <div class="admin-topbar-brand">
      <img src="/assets/logo.png" alt="شعار مركز أم القرى" onerror="this.style.display='none'">
      <span class="admin-topbar-title">مركز أم القرى - الإدارة</span>
    </div>
    <div class="admin-topbar-nav">
      <a href="/admin-dashboard.html">🏠 <span class="btn-text-hide">الرئيسية</span></a>
      <a href="/students.html" class="active">👥 <span class="btn-text-hide">الطلاب</span></a>
      <a href="/results-management.html">📊 <span class="btn-text-hide">النتائج</span></a>
      <a href="/admin-login.html" onclick="handleLogout(event)" style="color:rgba(255,255,255,0.7);">🚪 <span class="btn-text-hide">خروج</span></a>
    </div>
  </nav>

  <!-- Content -->
  <div class="admin-content">

    <!-- Breadcrumb -->
    <div class="breadcrumb mb-4">
      <a href="/admin-dashboard.html">الرئيسية</a>
      <span class="breadcrumb-sep">›</span>
      <a href="/students.html">إدارة الطلاب</a>
      <span class="breadcrumb-sep">›</span>
      <span>تعديل بيانات الطالب</span>
    </div>

    <div style="max-width:600px;">
      <div class="card">
        <div class="card-header">
          <h1 style="font-size:var(--font-size-xl); font-weight:700; color:var(--gray-800); margin:0;">
            ✏️ تعديل بيانات الطالب
          </h1>
        </div>
        <div class="card-body">

          <!-- Error Message -->
          <div id="form-error" class="alert alert-error" style="display:none;"></div>

          <!-- Info -->
          <div class="alert alert-info mb-4">
            <span>ℹ️</span>
            <span>يتم تحديث تاريخ آخر تعديل تلقائياً عند الحفظ</span>
          </div>

          <form id="edit-student-form" novalidate>
            <!-- Hidden ID -->
            <input type="hidden" id="student-id">

            <div class="form-group">
              <label class="form-label" for="registration_number">
                رقم القيد
                <span class="required">*</span>
              </label>
              <input
                type="text"
                id="registration_number"
                class="form-control"
                placeholder="رقم القيد..."
                required
              >
            </div>

            <div class="form-group">
              <label class="form-label" for="full_name">
                اسم الطالب
                <span class="required">*</span>
              </label>
              <input
                type="text"
                id="full_name"
                class="form-control"
                placeholder="الاسم الكامل..."
                required
              >
            </div>

            <div class="form-group">
              <label class="form-label" for="birth_year">
                سنة الميلاد
              </label>
              <input
                type="number"
                id="birth_year"
                class="form-control"
                placeholder="مثال: 2010"
                min="1990"
                max="2020"
              >
            </div>

            <div class="flex gap-3" style="flex-wrap:wrap;">
              <button type="submit" class="btn btn-primary" id="submit-btn">
                💾 حفظ التعديلات
              </button>
              <a href="/students.html" class="btn btn-ghost">إلغاء</a>
            </div>

          </form>

        </div>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <p>© 2026 مركز أم القرى</p>
  </footer>

  <script>
    async function handleLogout(e) {
      e.preventDefault()
      const { supabase } = await import('/js/supabase.js')
      await supabase.auth.signOut()
      window.location.href = '/admin-login.html'
    }
  </script>
  <script type="module" src="/js/student-management.js"></script>
</body>
</html>
